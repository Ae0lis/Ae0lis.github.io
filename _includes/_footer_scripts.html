{% if page.mediaplayer == true %}
<script>
$('audio,video').mediaelementplayer();
</script>
{% endif %}


<script src="{{ site.url }}{{ site.baseurl }}/assets/js/javascript.min.js"></script>

<script>
(function () {
  var toggle = document.querySelector('.toggle-topbar > a');
  var topbar = document.querySelector('.top-bar');
  if (!toggle || !topbar) return;

  toggle.addEventListener('click', function () {
    window.setTimeout(function () {
      toggle.setAttribute('aria-expanded', topbar.classList.contains('expanded') ? 'true' : 'false');
    }, 0);
  });
}());
</script>

{% if site.tawkto_embed_uri and page.tawkto == true %}
<script type="text/javascript">
var $_Tawk_API={},$_Tawk_LoadStart=new Date();
(function(){
var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
s1.async=true;
s1.src='{{ site.tawkto_embed_uri }}';
s1.charset='UTF-8';
s1.setAttribute('crossorigin','*');
s0.parentNode.insertBefore(s1,s0);
})();
</script>
{% endif %}
